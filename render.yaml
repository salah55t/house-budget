# مخطط النشر التلقائي على Render (Render Blueprint)
# يكفي ربط المستودع بـ Render واختيار "New Blueprint" ليُنشأ السيرفر تلقائياً.
services:
  - type: web
    name: house-budget-sync
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # نبض البقاء: السيرفر يطلب نفسه كل دقيقة ليمنع توقف الخطة المجانية
      # بعد 15 دقيقة من الخمول (RENDER_EXTERNAL_URL يضبطه Render حكماً)
      - key: SELF_PING_INTERVAL_MS
        value: "60000"
