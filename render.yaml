# مخطط النشر التلقائي على Render (Render Blueprint)
# يكفي ربط المستودع بـ Render واختيار "New Blueprint" ليُنشأ السيرفر تلقائياً.
services:
  - type: web
    name: house-budget-sync
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
